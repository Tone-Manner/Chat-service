server:
  port: 8083

spring:
  application:
    name: chat-service

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000  # AI 서버와 연결할 때 최대 3초 대기
            readTimeout: 12000    # AI 서버가 다듬은 문장을 줄 때까지 최대 12초 대기 (AI보다 2초 여유)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/chat_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1111
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}